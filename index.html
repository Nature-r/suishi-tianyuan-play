<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#53603b"/><title>岁时田园 · 二十四节气</title><meta name="description" content="一院一田，循着节气慢慢生活。可交互的二十四节气田园游戏。"/>
<style>
#startup-screen{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#304438;color:#57371d;font-family:STKaiti,KaiTi,serif;--startup-progress:0%;--startup-travel:180ms}
#startup-screen[hidden],#startup-screen [hidden]{display:none}
.startup-panel{position:relative;width:min(100vw,calc(100vh * 866 / 1817));width:min(100vw,calc(100dvh * 866 / 1817));aspect-ratio:866/1817;overflow:hidden;background:#e9cf8c;container-type:inline-size}
.startup-art{display:block;width:100%;height:100%}
.startup-progress{position:absolute;left:6.4%;right:6.4%;top:74.78%;height:5.42%;isolation:isolate;display:grid;place-items:center}
.startup-track{position:absolute;inset:0;overflow:hidden;border-radius:999px;background:#fff5d9;z-index:-1}
.startup-fill{width:var(--startup-progress);height:100%;border-radius:inherit;background:linear-gradient(#fbe395,#eeba51);transition:width var(--startup-travel) linear}
.startup-label{font-size:18px;font-size:clamp(14px,5cqw,28px);letter-spacing:.06em;text-shadow:0 1px #fff4dc}
.startup-runner{position:absolute;left:var(--startup-progress);bottom:calc(100% + 2px);width:14%;height:auto;transform:translate(-50%,7%);transition:left var(--startup-travel) linear;pointer-events:none}
.startup-recovery{position:absolute;top:81.5%;left:8%;right:8%;padding:8px 10px;text-align:center;border:1px solid #b99459;border-radius:12px;background:#fff3d9;font:12px/1.5 system-ui,sans-serif}
.startup-recovery p{margin:0 0 6px}.startup-recovery button{padding:5px 12px;border:1px solid #8b6a37;border-radius:8px;background:#fff4d9;color:inherit;font:inherit;cursor:pointer}
#startup-screen[data-failed] .startup-runner,#startup-screen[data-failed] .startup-fill{visibility:hidden}
</style>  <script type="module" crossorigin src="./assets/game-b3H8EkvN.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/CharacterAnimator-CO92dMjG.js">
  <link rel="stylesheet" crossorigin href="./assets/game-Cm0NpfAi.css">
</head>
<body><main id="frame"><div id="game" aria-label="田园游戏场景"></div><div id="ui"></div></main>
<section id="startup-screen" aria-label="岁时田园场景加载"><div class="startup-panel">
 <img class="startup-art" src="./assets/startup/farm.png" width="866" height="1817" alt="" fetchpriority="high"/>
 <div class="startup-progress">
  <div class="startup-track" role="progressbar" aria-label="场景加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="startup-fill"></div></div>
  <span class="startup-label" role="status">加载中 0%</span><canvas class="startup-runner" width="104" height="104" aria-hidden="true"></canvas>
 </div>
 <div class="startup-recovery" hidden><p></p><button type="button" onclick="window.location.reload()">重新加载</button></div>
</div></section></body>
</html>
