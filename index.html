<script>
// This runs even if the game script never finishes downloading.
{
 const screen=document.querySelector('#startup-screen');
 const progress=screen.querySelector('[role="progressbar"]');
 const status=screen.querySelector('[role="status"]');
 const recovery=screen.querySelector('.startup-recovery');
 const hint=recovery.querySelector('p');
 const retry=()=>{
  const url=new URL(location.href);
  url.searchParams.set('reload',Date.now().toString(36));
  location.replace(url.href);
 };
 const onEntryError=event=>{
  if(!event.target||event.target.id!=='game-entry')return;
  screen.setAttribute('data-failed','');
  status.textContent='游戏程序下载失败';
  hint.textContent='请检查网络连接后重新加载。已有存档和布局会保留。';
  recovery.hidden=false;
